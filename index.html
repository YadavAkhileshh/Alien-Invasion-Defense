<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Akhilesh Yadav">
    <meta name="description"
        content="Alien Invasion Defense - A thrilling space shooter game where you defend Earth from alien invaders with power-ups and strategic gameplay!">
    <meta name="keywords"
        content="Alien Invasion Defense, alien shooter, space game, defense game, arcade game, power-ups, gaming experience, space invaders">
    <meta name="robots" content="index, follow">
    <link rel="icon" href="favicon.png" type="image/x-icon">
    <title>Alien Invasion Defense | Space Shooter Game</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="game/alien-defense-styles.css">

    <!-- Audio -->
    <audio id="backgroundMusic" src="audio/background-music.wav" loop></audio>
    <audio id="hitSound" src="audio/hit-sound.wav"></audio>
    <audio id="gameOverSound" src="audio/gameOver.wav"></audio>
    <audio id="shieldSound" src="audio/shield.wav"></audio>
    <audio id="healthBoostSound" src="audio/health-boost-sound.m4a"></audio>
    <audio id="speedBoostSound" src="audio/speed-boost.m4a"></audio>
    <audio id="congratsSound" src="audio/congrats.wav"></audio>
</head>

<body>
    <div class="game-container">
        <main class="main-area">
            <!-- Top Bar -->
            <div class="top-bar">
                <div class="logo-section">
                    <img src="assets/images/alien.png" alt="Logo">
                    <h1>Alien Defense</h1>
                </div>

                <div class="stats-bar">
                    <div class="stat-item">
                        <i class="fas fa-star"></i>
                        <div>
                            <span class="stat-label">Score</span>
                            <span class="stat-value" id="currentScore">0</span>
                        </div>
                    </div>

                    <div class="stat-item">
                        <i class="fas fa-heart"></i>
                        <div>
                            <span class="stat-label">Lives</span>
                            <span class="stat-value" id="currentLives">3</span>
                        </div>
                    </div>
                    <div class="stat-item">
                        <i class="fas fa-trophy"></i>
                        <div>
                            <span class="stat-label">Best</span>
                            <span class="stat-value" id="highScore">0</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls-bar">
                <div class="control-item">
                    <label>Difficulty:</label>
                    <select id="difficultySelect">
                        <option value="easy">Easy</option>
                        <option value="medium" selected>Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>

                <div class="control-item">
                    <button id="volumeToggle" class="icon-btn">
                        <i class="fas fa-volume-up"></i>
                    </button>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.5">
                </div>
            </div>

            <!-- Rules -->
            <div class="rules-section">
                <h3><i class="fas fa-gamepad"></i> How to Play</h3>
                <div class="rules-grid">
                    <div class="rule">
                        <i class="fas fa-keyboard"></i>
                        <span>A/D or ← → to move</span>
                    </div>
                    <div class="rule">
                        <i class="fas fa-mouse-pointer"></i>
                        <span>Space or Click to shoot</span>
                    </div>
                    <div class="rule">
                        <i class="fas fa-crosshairs"></i>
                        <span>Destroy all aliens</span>
                    </div>
                    <div class="rule">
                        <i class="fas fa-shield-alt"></i>
                        <span>Collect power-ups</span>
                    </div>
                </div>
            </div>

            <!-- Game -->
            <div class="game-wrapper">
                <div class="game-canvas-container">
                    <canvas id="gameCanvas"></canvas>

                    <!-- Start Overlay -->
                    <div class="game-overlay" id="startOverlay">
                        <div class="overlay-content">
                            <h1 class="game-title">ALIEN INVASION<br><span>DEFENSE</span></h1>
                            <p>Defend Earth from alien invaders!</p>
                            <button class="play-btn" id="startButton" onclick="enterFullscreenAndStart()">
                                <i class="fas fa-play"></i> PLAY NOW
                            </button>
                        </div>
                    </div>

                    <!-- Game Over -->
                    <div class="game-overlay hidden" id="gameOverOverlay">
                        <div class="overlay-content">
                            <h2>GAME OVER</h2>
                            <div class="final-stats">
                                <div>
                                    <span>Score</span>
                                    <strong id="finalScore">0</strong>
                                </div>

                            </div>
                            <div class="overlay-actions">
                                <button class="btn-primary" id="restartButton">
                                    <i class="fas fa-redo"></i> Play Again
                                </button>
                                <button class="btn-secondary" id="shareButton">
                                    <i class="fas fa-share-alt"></i> Share
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Pause -->
                    <div class="game-overlay hidden" id="pauseOverlay">
                        <div class="overlay-content">
                            <h2>PAUSED</h2>
                            <button class="btn-primary" id="resumeButton">
                                <i class="fas fa-play"></i> Resume
                            </button>
                        </div>
                    </div>

                    <div class="active-powerups" id="activePowerups"></div>
                    <div class="warning-message hidden" id="warningMessage">
                        <i class="fas fa-exclamation-triangle"></i>
                        <span>Only 1 life remaining!</span>
                    </div>
                </div>
            </div>

            <!-- Mobile Controls -->
            <div class="mobile-controls" id="mobileControls">
                <button class="mobile-btn" id="leftButton">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <button class="mobile-btn mobile-btn-fire" id="fireButton">
                    <i class="fas fa-bullseye"></i>
                </button>
                <button class="mobile-btn" id="rightButton">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </main>
    </div>

    <div class="toast" id="toast"><span id="toastMessage"></span></div>
    <div class="achievement hidden" id="achievementToast">
        <i class="fas fa-trophy"></i>
        <div>
            <strong>New High Score!</strong>
            <span id="achievementDesc">You beat your record!</span>
        </div>
    </div>
    <div class="particles" id="particles"></div>

    <script>
        // Prevent space scrolling
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && e.target === document.body) {
                e.preventDefault();
            }
        });

        // Particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 5 + 's';
                p.style.animationDuration = (Math.random() * 3 + 2) + 's';
                container.appendChild(p);
            }
        }

        // Toast
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toastMessage');
            toast.className = `toast ${type}`;
            msg.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Fullscreen and start game function
        function enterFullscreenAndStart() {
            // Request fullscreen
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
            
            // Start the game after a short delay to ensure fullscreen is active
            setTimeout(() => {
                if (typeof startGame === 'function') {
                    startGame();
                } else {
                    console.error('startGame function not found');
                }
            }, 100);
        }

        document.addEventListener('DOMContentLoaded', () => {
            createParticles();
            setTimeout(() => showToast('Welcome to Alien Defense!'), 1000);
        });

        document.addEventListener('gameStart', () => showToast('Game Started!', 'success'));
        document.addEventListener('gameOver', () => showToast('Game Over!', 'error'));
    </script>

    <script src="game/game-patch.js"></script>
    <script src="game/alien-defense-engine.js"></script>
    <script src="game/shooting-fix.js"></script>
</body>

</html>
